name: Build Remedial Matrix APK

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create app_build

      - name: Copy Files into Project
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp main.dart app_build/lib/main.dart
          mkdir -p app_build/assets
          cp assets/questions.json app_build/assets/questions.json || true
          cp assets/logo.png app_build/assets/logo.png || true

      - name: Fix Android SDK Versions Safely
        run: |
          sed -i 's/flutter.compileSdkVersion/36/g' app_build/android/app/build.gradle.kts || true
          sed -i 's/flutter.targetSdkVersion/36/g' app_build/android/app/build.gradle.kts || true
          sed -i 's/flutter.minSdkVersion/23/g' app_build/android/app/build.gradle.kts || true

      - name: Disable Lint Errors (THE FIX)
        run: |
          # Lint ኤረር ካገኘ እንዳያቋርጥ (Abort እንዳያደርግ) እናዛለን
          echo "
          android {
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          " >> app_build/android/app/build.gradle

      - name: Add Internet Permission
        run: |
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>/g' app_build/android/app/src/main/AndroidManifest.xml || true

      - name: Install dependencies & Generate Logo
        working-directory: ./app_build
        run: |
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK
        working-directory: ./app_build
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: RemedialMatrix-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

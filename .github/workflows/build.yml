name: Build Remedial Matrix APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Stable 3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Ensure Permanent Keystore Exists
        run: |
          if [ ! -f "remedial-release-key.jks" ]; then
            keytool -genkey -v -keystore remedial-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 -alias remedial_key \
              -dname "CN=Mubarek Mustefa, OU=Remedial Matrix, O=Remedial Matrix, L=Addis Ababa, S=AA, C=ET" \
              -storepass Remedial2026 -keypass Remedial2026
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add remedial-release-key.jks
            git commit -m "Save permanent signing keystore [skip ci]" || true
            git push || true
          fi

      - name: Create Flutter Project
        run: flutter create --org com.remedial.matrix --project-name remedial_matrix app_build

      - name: Copy Files into Project
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp main.dart app_build/lib/main.dart
          cp remedial-release-key.jks app_build/android/app/remedial-release-key.jks
          mkdir -p app_build/assets
          cp assets/questions.json app_build/assets/questions.json || cp questions.json app_build/assets/questions.json || true
          cp assets/logo.png app_build/assets/logo.png || cp logo.png app_build/assets/logo.png || true

      - name: Configure App Name, Permissions & Permanent Release Signing
        run: |
          python3 -c '
          import os

          manifest_path = "app_build/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()
          m = m.replace("android:label=\"remedial_matrix\"", "android:label=\"Remedial Matrix\"")
          m = m.replace("android:label=\"app_build\"", "android:label=\"Remedial Matrix\"")
          if "REQUEST_INSTALL_PACKAGES" not in m:
              perms = "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>\n    <application"
              m = m.replace("<application", perms, 1)
          with open(manifest_path, "w") as f:
              f.write(m)

          gradle_path = "app_build/android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r") as f:
                  g = f.read()
              g = g.replace("flutter.compileSdkVersion", "35")
              g = g.replace("flutter.targetSdkVersion", "34")
              g = g.replace("flutter.minSdkVersion", "21")
              signing_block = """
          android {
              signingConfigs {
                  release {
                      storeFile file("remedial-release-key.jks")
                      storePassword "Remedial2026"
                      keyAlias "remedial_key"
                      keyPassword "Remedial2026"
                  }
              }
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          """
              with open(gradle_path, "w") as f:
                  f.write(g + "\n" + signing_block)

          kts_path = "app_build/android/app/build.gradle.kts"
          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  k = f.read()
              k = k.replace("flutter.compileSdkVersion", "35")
              k = k.replace("flutter.targetSdkVersion", "34")
              k = k.replace("flutter.minSdkVersion", "21")
              k += "\nandroid { lint { checkReleaseBuilds = false; abortOnError = false } }\n"
              with open(kts_path, "w") as f:
                  f.write(k)
          '

      - name: Install Dependencies & Generate Icon
        working-directory: ./app_build
        run: |
          flutter pub get
          dart run flutter_launcher_icons || true

      - name: Build Universal APK
        working-directory: ./app_build
        run: |
          flutter build apk --release --tree-shake-icons --target-platform android-arm,android-arm64 -Pdisable-lint=true
          cp build/app/outputs/flutter-apk/app-release.apk ../Remedial_Matrix_Universal.apk

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remedial-Matrix-Universal-APK
          path: Remedial_Matrix_Universal.apk

      - name: Publish Direct Download Link to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Remedial Matrix Latest Release
          files: Remedial_Matrix_Universal.apk

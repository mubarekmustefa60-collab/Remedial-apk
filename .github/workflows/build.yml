name: Build Remedial Matrix APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project
        run: flutter create app_build

      - name: Copy Files into Project
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp main.dart app_build/lib/main.dart
          mkdir -p app_build/assets
          cp assets/questions.json app_build/assets/questions.json || true

      - name: Fix Android SDK Versions
        run: |
          # አዲሱን እና አሮጌውን የ Flutter አጻጻፍ ፈልጎ ያስተካክላል
          find app_build/android/app -type f -exec sed -i 's/flutter.minSdkVersion/23/g' {} +
          find app_build/android/app -type f -exec sed -i 's/flutter.minSdk/23/g' {} +
          find app_build/android/app -type f -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +
          find app_build/android/app -type f -exec sed -i 's/flutter.targetSdk/34/g' {} +
          find app_build/android/app -type f -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find app_build/android/app -type f -exec sed -i 's/flutter.compileSdk/34/g' {} +

      - name: Add Internet Permission
        run: |
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.INTERNET"\/>/g' app_build/android/app/src/main/AndroidManifest.xml || true

      - name: Install dependencies
        working-directory: ./app_build
        run: flutter pub get

      - name: Build APK
        working-directory: ./app_build
        run: flutter build apk --release

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: RemedialMatrix-App
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

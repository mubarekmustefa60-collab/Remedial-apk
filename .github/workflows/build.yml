name: Build Remedial Matrix APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Stable 3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Ensure Permanent Keystore Exists
        run: |
          if [ ! -f "remedial-release-key.jks" ]; then
            keytool -genkey -v -keystore remedial-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 -alias remedial_key \
              -dname "CN=Mubarek Mustefa, OU=Remedial Matrix, O=Remedial Matrix, L=Addis Ababa, S=AA, C=ET" \
              -storepass Remedial2026 -keypass Remedial2026
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add remedial-release-key.jks
            git commit -m "Save permanent signing keystore [skip ci]" || true
            git push || true
          fi

      - name: Create Flutter Project
        run: flutter create --org com.remedial.matrix --project-name remedial_matrix app_build

      - name: Copy Files into Project
        run: |
          cp pubspec.yaml app_build/pubspec.yaml
          cp main.dart app_build/lib/main.dart
          cp remedial-release-key.jks app_build/android/app/remedial-release-key.jks
          if [ -f "google-services.json" ]; then
            cp google-services.json app_build/android/app/google-services.json
          fi
          mkdir -p app_build/assets
          cp assets/questions.json app_build/assets/questions.json || cp questions.json app_build/assets/questions.json || true
          cp assets/logo.png app_build/assets/logo.png || cp logo.png app_build/assets/logo.png || true

      - name: Configure Android Manifest, FCM, Desugaring, FLAG_SECURE & Signing
        run: |
          python3 -c '
          import os

          has_google_services = os.path.exists("app_build/android/app/google-services.json")

          manifest_path = "app_build/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()
          m = m.replace("android:label=\"remedial_matrix\"", "android:label=\"Remedial Matrix\"")
          m = m.replace("android:label=\"app_build\"", "android:label=\"Remedial Matrix\"")
          if "REQUEST_INSTALL_PACKAGES" not in m:
              perms = (
                  "<uses-permission android:name=\"android.permission.INTERNET\"/>\n"
                  "    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>\n"
                  "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n"
                  "    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n"
                  "    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n"
                  "    <application"
              )
              m = m.replace("<application", perms, 1)
          with open(manifest_path, "w") as f:
              f.write(m)

          settings_path = "app_build/android/settings.gradle"
          if has_google_services and os.path.exists(settings_path):
              with open(settings_path, "r") as f:
                  s = f.read()
              if "com.google.gms.google-services" not in s:
                  s = s.replace(
                      "id \"org.jetbrains.kotlin.android\"",
                      "id \"com.google.gms.google-services\" version \"4.4.2\" apply false\n    id \"org.jetbrains.kotlin.android\"",
                      1
                  )
                  with open(settings_path, "w") as f:
                      f.write(s)

          gradle_path = "app_build/android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r") as f:
                  g = f.read()
              g = g.replace("flutter.compileSdkVersion", "35")
              g = g.replace("flutter.targetSdkVersion", "34")
              g = g.replace("flutter.minSdkVersion", "21")
              if has_google_services and "com.google.gms.google-services" not in g:
                  g = g.replace(
                      "id \"dev.flutter.flutter-gradle-plugin\"",
                      "id \"dev.flutter.flutter-gradle-plugin\"\n    id \"com.google.gms.google-services\"",
                      1
                  )
              extra_block = """
          android {
              compileOptions {
                  coreLibraryDesugaringEnabled true
              }
              signingConfigs {
                  release {
                      storeFile file("remedial-release-key.jks")
                      storePassword "Remedial2026"
                      keyAlias "remedial_key"
                      keyPassword "Remedial2026"
                  }
              }
              lintOptions {
                  checkReleaseBuilds false
                  abortOnError false
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
          }
          """
              with open(gradle_path, "w") as f:
                  f.write(g + "\n" + extra_block)

          for root, dirs, files in os.walk("app_build/android/app/src/main/kotlin"):
              for fn in files:
                  if fn == "MainActivity.kt":
                      ma_path = os.path.join(root, fn)
                      with open(ma_path, "r") as f:
                          first_line = f.readline().strip()
                      kotlin_code = first_line + """

          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.remedial.matrix/security"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "setSecure") {
                          val secure = call.argument<Boolean>("secure") ?: true
                          if (secure) {
                              window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                          } else {
                              window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                          }
                          result.success(true)
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          """
                      with open(ma_path, "w") as f:
                          f.write(kotlin_code)
          '

      - name: Install Dependencies, Patch Notification Plugin & Generate Icon
        working-directory: ./app_build
        run: |
          flutter pub get
          python3 -c '
          import glob, os, re
          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          pattern = os.path.join(pub_cache, "hosted", "pub.dev", "flutter_local_notifications-*", "android", "src", "main", "java", "com", "dexterous", "flutterlocalnotifications", "FlutterLocalNotificationsPlugin.java")
          for p in glob.glob(pattern):
              with open(p, "r") as f:
                  txt = f.read()
              new_txt = re.sub(r"bigLargeIcon\s*\(\s*null\s*\)", "bigLargeIcon((android.graphics.Bitmap) null)", txt)
              with open(p, "w") as f:
                  f.write(new_txt)
              print("Patched:", p)
          '
          dart run flutter_launcher_icons || true

      - name: Build Universal APK
        working-directory: ./app_build
        run: |
          flutter build apk --release --tree-shake-icons --target-platform android-arm,android-arm64 -Pdisable-lint=true
          cp build/app/outputs/flutter-apk/app-release.apk ../Remedial_Matrix_Universal.apk

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remedial-Matrix-Universal-APK
          path: Remedial_Matrix_Universal.apk

      - name: Publish to Private Releases Backup
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Remedial Matrix v1.2.0
          files: Remedial_Matrix_Universal.apk

name: remedial_matrix
description: Remedial Matrix Educational App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_database: ^11.1.5
  image_picker: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_version: 23

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/logo.png

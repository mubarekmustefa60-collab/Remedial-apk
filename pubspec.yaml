name: remedial_matrix
description: Remedial Matrix Educational App
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: 6.2.5
  shared_preferences: 2.2.2
  firebase_core: 2.27.0
  firebase_database: 10.4.9
  firebase_messaging: 14.7.19
  firebase_analytics: 10.8.9
  flutter_local_notifications: ^17.2.3
  image_picker: 1.0.7
  dio: 5.4.1
  path_provider: 2.1.2
  open_filex: 4.4.0
  share_plus: 7.2.2
  file_picker: ^6.1.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_version: 21

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/remedial_2019_model_exams.json
    - assets/logo.png

name: remedial_matrix
description: Remedial Matrix Educational App
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  url_launcher: 6.2.5
  shared_preferences: 2.2.2
  firebase_core: 2.27.0
  firebase_database: 10.4.9
  image_picker: 1.0.7
  dio: 5.4.1
  path_provider: 2.1.2
  open_filex: 4.4.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_version: 21

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/logo.png

name: remedial_matrix
description: Remedial Matrix Educational App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: 6.1.14
  shared_preferences: 2.2.1
  firebase_core: 2.24.2
  firebase_database: 10.3.8
  image_picker: 0.8.9

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_version: 23

flutter:
  uses-material-design: true
  assets:
    - assets/questions.json
    - assets/logo.png
